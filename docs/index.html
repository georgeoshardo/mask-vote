<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Mask Vote</title>
<style>
:root { --bg: #0e0f12; --panel: #17191e; --text: #e8eaee; --muted: #8b919c; --good: #3fb37f; --bad: #e0565b; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100dvh; }
#top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; color: var(--muted); font-size: 12px; }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; touch-action: pan-y; }
canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
#bar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
button { font: inherit; border: 0; border-radius: 12px; padding: 16px 0; color: #fff; cursor: pointer; }
#bad { background: var(--bad); font-size: 20px; } #good { background: var(--good); font-size: 20px; }
#skip { background: var(--panel); color: var(--muted); padding: 16px 18px; }
button:active { filter: brightness(1.2); }
#login { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; gap: 10px; padding: 24px; max-width: 420px; margin: auto; }
#login.on { display: flex; }
#login input { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid #2a2e36; background: var(--panel); color: var(--text); }
#login button { background: #3b6fd8; }
#msg { color: var(--bad); min-height: 1.4em; }
#flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
</style>
</head>
<body>
<div id="top"><span id="count"></span><span id="info"></span></div>
<div id="stage"><canvas id="view"></canvas></div>
<div id="bar"><button id="bad" aria-label="Bad mask">✕</button><button id="skip">Skip</button><button id="good" aria-label="Good mask">✓</button></div>
<div id="flash"></div>
<form id="login"><b>Mask Vote</b>
  <input id="name" placeholder="Your name" autocomplete="name" required>
  <input id="pw" type="password" placeholder="Password" required>
  <button>Start</button><div id="msg"></div>
</form>
<script type="module" src="app.js"></script>
</body>
</html>
